[workspace]
members = [
  "ostiarius-client",
  "ostiarius-core",
  "ostiarius-server",
]
resolver = "2"

[workspace.package]
version = "0.8.2"
authors = ["Eric Le Bihan <eric.le.bihan.dev@free.fr>"]
edition = "2021"
license = "MIT"
rust-version = "1.64"

[workspace.dependencies]
anyhow = "1.0.59"
chrono = { version = "0.4.19", features = ["serde"] }
gumdrop = "0.8.1"
uuid = { version = "1.15.1", features = ["serde", "v4", "rng-getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.82"
